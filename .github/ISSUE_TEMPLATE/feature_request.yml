name: Feature request
description: An idea for something HesteClips could do.
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What you're trying to do, and how you do it today.
    validations:
      required: false
