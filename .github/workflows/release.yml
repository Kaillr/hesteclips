# Release: run by hand (Actions → Release → Run workflow) on main.
# semantic-release reads the commits since the last tag (feat: → minor,
# fix: → patch, BREAKING CHANGE → major), builds the Windows installer and
# update packages (scripts/release.ps1), tags vX.Y.Z and publishes the GitHub
# release the installed apps update from. No release-worthy commits → nothing.
# Then the Linux and macOS jobs build HesteClips-linux-x64.tar.gz and
# HesteClips-mac-arm64.dmg and add them to that release. Given a tag, only
# those two are built, for that release.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Only add the Linux and macOS packages to this existing release (e.g. v1.3.0)
        required: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: inputs.tag == ''
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags and commits, to work out the version

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same version as the velopack crate in crates/app/Cargo.toml.
      - run: dotnet tool install -g vpk --version 1.2.161

      - run: npm ci

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The tag semantic-release just made, if it made one.
      - id: tag
        shell: bash
        run: echo "tag=$(git tag --points-at HEAD 'v*' | head -n1)" >> "$GITHUB_OUTPUT"

  linux:
    needs: release
    # Runs after a release (or on its own, given a tag); skipped when nothing
    # was released.
    if: always() && (inputs.tag != '' || (needs.release.result == 'success' && needs.release.outputs.tag != ''))
    # 24.04, not older: the pipewire crate needs PipeWire 1.0's headers. The
    # binary then needs glibc 2.39+ (Ubuntu 24.04, Fedora 40, Debian 13, Arch).
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag }}

      - run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev libpipewire-0.3-dev libdbus-1-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Packaging as main has it (what's bundled, how), for an older tag too.
      - run: git fetch --depth=1 origin main && git show FETCH_HEAD:scripts/release-linux.sh > scripts/release-linux.sh && chmod +x scripts/release-linux.sh

      - run: scripts/release-linux.sh "${TAG#v}"

      - run: gh release upload "$TAG" Releases/HesteClips-linux-x64.tar.gz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mac:
    needs: release
    # Like the Linux job: after a release, or on its own given a tag.
    if: always() && (inputs.tag != '' || (needs.release.result == 'success' && needs.release.outputs.tag != ''))
    # Apple Silicon. Free for a public repo, like the others.
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag || needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || needs.release.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Packaging as main has it (what's bundled, how), for an older tag too.
      - run: git fetch --depth=1 origin main && git show FETCH_HEAD:scripts/release-mac.sh > scripts/release-mac.sh && chmod +x scripts/release-mac.sh

      - run: scripts/release-mac.sh "${TAG#v}"

      - run: gh release upload "$TAG" Releases/HesteClips-mac-arm64.dmg --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
