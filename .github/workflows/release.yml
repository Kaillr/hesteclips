# Release: run by hand (Actions → Release → Run workflow) on main.
#
# 1. version: semantic-release reads the commits since the last tag (feat: →
#    minor, fix: → patch, BREAKING CHANGE → major) and says what the next
#    version is, without releasing anything. No release-worthy commits → the
#    rest is skipped.
# 2. windows, linux, mac: build that version for the platforms ticked when
#    running it (installer and update packages, HesteClips-linux-x64.tar.gz,
#    HesteClips-mac-arm64.dmg), all at once.
# 3. publish: only once every ticked build is done, semantic-release tags
#    vX.Y.Z and publishes the GitHub release with everything on it, which the
#    installed apps update from. A failed build means no release, never half
#    of one.
#
# Given a tag, the ticked platforms are built for that existing release and
# added to it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Only add the ticked platforms to this existing release (e.g. v1.3.0)
        required: false
      windows:
        description: Windows
        type: boolean
        default: true
      linux:
        description: Linux
        type: boolean
        default: false
      mac:
        description: macOS
        type: boolean
        default: false

permissions:
  contents: write

concurrency: release

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # all tags and commits, to work out the version

      - uses: actions/setup-node@v5
        if: inputs.tag == ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: inputs.tag == ''

      # The next version (written by .releaserc.json's verifyReleaseCmd), and
      # the commit every build uses, so all three build the same code.
      - id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx semantic-release --dry-run
          if [ -f .next-version ]; then
            echo "version=$(cat .next-version)" >> "$GITHUB_OUTPUT"
            echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to release."
          fi

  windows:
    needs: version
    if: needs.version.outputs.version != '' && inputs.windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same version as the velopack crate in crates/app/Cargo.toml.
      - run: dotnet tool install -g vpk --version 1.2.161

      # The token: the previous release, so updates to this one can be deltas.
      - run: pwsh -NoProfile -File scripts/release.ps1 -Version ${{ needs.version.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Releases/*
          if-no-files-found: error

  linux:
    needs: version
    if: needs.version.outputs.version != '' && inputs.linux
    # 24.04, not older: the pipewire crate needs PipeWire 1.0's headers. The
    # binary then needs glibc 2.39+ (Ubuntu 24.04, Fedora 40, Debian 13, Arch).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}

      - run: sudo apt-get update && sudo apt-get install -y build-essential libclang-dev libpipewire-0.3-dev libdbus-1-dev libasound2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Packaging as main has it (what's bundled, how), for an older tag too.
      - run: git fetch --depth=1 origin main && git show FETCH_HEAD:scripts/release-linux.sh > scripts/release-linux.sh && chmod +x scripts/release-linux.sh

      - run: scripts/release-linux.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: Releases/HesteClips-linux-x64.tar.gz
          if-no-files-found: error

  mac:
    needs: version
    if: needs.version.outputs.version != '' && inputs.mac
    # Apple Silicon. Free for a public repo, like the others.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      # Packaging as main has it (what's bundled, how), for an older tag too.
      - run: git fetch --depth=1 origin main && git show FETCH_HEAD:scripts/release-mac.sh > scripts/release-mac.sh && chmod +x scripts/release-mac.sh

      - run: scripts/release-mac.sh ${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Releases/HesteClips-mac-arm64.dmg
          if-no-files-found: error

  publish:
    needs: [version, windows, linux, mac]
    # At least one platform ticked, and every build that ran succeeded (the
    # unticked ones are skipped).
    if: >-
      always() && needs.version.outputs.version != '' &&
      (inputs.windows || inputs.linux || inputs.mac) &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: Releases
          merge-multiple: true

      - run: ls -la Releases

      - name: Add to the existing release
        if: inputs.tag != ''
        run: gh release upload "${{ inputs.tag }}" Releases/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        if: inputs.tag == ''
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: inputs.tag == ''

      # Tags the commit the builds used and publishes Releases/*. Checks the
      # version is still the one built (verifyReleaseCmd); semantic-release
      # also refuses if main moved on meanwhile — run the workflow again then.
      - run: git checkout -B main && npx semantic-release
        if: inputs.tag == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECT_VERSION: ${{ needs.version.outputs.version }}
