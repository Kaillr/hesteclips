[package]
name = "hesteclips"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hesteclips"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
bytemuck = "1"
capture = { path = "../capture" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clipboard-rs = { version = "0.3", default-features = false }
cpal = "0.18"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
drag = "2"
eframe = "0.36.1"
epaint_default_fonts = "0.36"
egui = "0.36.1"
global-hotkey = "0.8.0"
hestefiles = { version = "0.1.0", path = "../hestefiles" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
media = { path = "../media" }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5"
uuid = { version = "1", features = ["v4"] }

# Windows-only: drawing decoded frames straight from the GPU (gpu_frames.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12"] }

# macOS-only: the system share sheet (AirDrop, Messages, Mail, …).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSSharingService", "NSView", "NSResponder"] }

# Windows-only: the system Share UI, and opening files with their default app.
[target.'cfg(target_os = "windows")'.dependencies]
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
