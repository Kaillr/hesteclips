[package]
name = "hesteclips"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hesteclips"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
log = "0.4"
bytemuck = "1"
capture = { path = "../capture" }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clipboard-rs = { version = "0.3", default-features = false }
cpal = "0.18"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
eframe = "0.36.1"
epaint_default_fonts = "0.36"
egui = "0.36.1"
global-hotkey = "0.8.0"
hestefiles = { path = "../hestefiles" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
media = { path = "../media" }
raw-window-handle = "0.6"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
trash = "5"
# "Hashtag HesteClip that" (voice.rs): runs its small ONNX models, pure Rust.
tract-onnx = "0.23.8"
uuid = { version = "1", features = ["v4"] }
discord-rich-presence = "1.1.0"
ureq = { version = "3.4.2", features = ["json"] }

# Dragging a clip out of the window as a file. Its Linux side needs a GTK
# window, which eframe doesn't have.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
drag = "2"
# The tray / menu bar icon (closing the window keeps HesteClips running).
tray-icon = "0.21"

# Linux: global shortcuts through the desktop portal (Wayland has no other
# way), and showing a clip in the file manager.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false }
pollster = "1"

# Windows-only: drawing decoded frames straight from the GPU (gpu_frames.rs).
[target.'cfg(windows)'.dependencies]
velopack = "1.2.161"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Direct3D12", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Threading"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"

# macOS-only: the system share sheet (AirDrop, Messages, Mail, …).
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6.4"
# Decoded frames drawn straight from their IOSurfaces (gpu_frames.rs); the
# versions wgpu's Metal backend uses.
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std", "IOSurfaceRef", "objc2"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLAllocation", "MTLDevice", "MTLPixelFormat", "MTLResource", "MTLTexture", "objc2-io-surface"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3.2", features = ["NSSharingService", "NSView", "NSResponder"] }

# Windows-only: the system Share UI, and opening files with their default app.
[target.'cfg(target_os = "windows")'.dependencies]
windows-collections = "0.3"
windows-core = "0.62"
windows-future = "0.3"
windows = { version = "0.62", features = [
    "ApplicationModel_DataTransfer",
    "Foundation_Collections",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
hound = "3"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
